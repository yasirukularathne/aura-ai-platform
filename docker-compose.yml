x-aura-environment: &aura-environment
  QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
  QDRANT_API_KEY: ${QDRANT_API_KEY:-}
  QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-aura_documents}
  EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-BAAI/bge-small-en-v1.5}
  UPLOAD_DIR: /app/data/documents/uploads
  STORAGE_BACKEND: ${STORAGE_BACKEND:-local}

services:
  backend:
    build:
      context: ./backend
    container_name: aura-backend
    env_file:
      - .env
    environment:
      <<: *aura-environment
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://aura:aura@postgres:5432/aura
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - document_uploads:/app/data/documents/uploads
      - application_data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
      - redis
      - postgres

  worker:
    build:
      context: ./backend
    container_name: aura-worker
    env_file:
      - .env
    environment:
      <<: *aura-environment
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://aura:aura@postgres:5432/aura
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - document_uploads:/app/data/documents/uploads
      - application_data:/app/data
    command: celery -A app.worker.celery_app worker --loglevel=INFO
    depends_on:
      - redis
      - postgres
      - qdrant

  postgres:
    image: postgres:16-alpine
    container_name: aura-postgres
    environment:
      POSTGRES_DB: aura
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: aura
    volumes:
      - postgres_storage:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura -d aura"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: aura-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.2.0
    container_name: aura-grafana
    volumes:
      - grafana_storage:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  qdrant:
    image: qdrant/qdrant:latest
    container_name: aura-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: aura-redis
    volumes:
      - redis_storage:/data

volumes:
  qdrant_storage:
  document_uploads:
  application_data:
  redis_storage:
  postgres_storage:
  grafana_storage:
