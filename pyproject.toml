[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
pythonpath = ["backend"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["backend/app"]
branch = true

[tool.coverage.report]
fail_under = 20
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = ["backend/venv", "backend/models"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
